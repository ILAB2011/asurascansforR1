<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Asura Scans for R1</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b0c10;
            color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
        }
        .container {
            padding: 12px; text-align: center; box-sizing: border-box;
        }
        h2 { font-size: 16px; margin-top: 10px; color: #66fcf1; }
        p { font-size: 11px; color: #c5c6c7; line-height: 1.4; }
        .btn {
            display: inline-block; background-color: #66fcf1; color: #0b0c10;
            padding: 10px 16px; font-weight: bold; font-size: 12px;
            border-radius: 6px; text-decoration: none; margin: 12px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .footer-note { font-size: 9px; color: #45a29e; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Asura Reader</h2>
        <p>Optimized directly for your Rabbit R1's display engine.</p>
        <a href="https://asurascans.com" class="btn" id="launch-btn">Launch Asura Scans</a>
        <p class="footer-note">Log in once and tick "Remember Me" to preserve your session cookies on this card stack.</p>
    </div>

    <script>
        // Auto-redirect instantly to avoid wasting hardware memory rendering this gateway page
        window.location.replace("https://asurascans.com");
    </script>
</body>
</html>
